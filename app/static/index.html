<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Agent Automation - Chat</title>
<style>
  :root {
    --bg: #0f172a;
    --panel: #1e293b;
    --panel-2: #334155;
    --text: #e2e8f0;
    --muted: #94a3b8;
    --accent: #38bdf8;
    --accent-2: #818cf8;
    --user: #0ea5e9;
    --assistant: #334155;
    --tool: #f59e0b;
    --err: #ef4444;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: "Segoe UI", system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
    height: 100vh;
    display: flex;
  }
  aside {
    width: 260px;
    background: var(--panel);
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 12px;
    border-right: 1px solid var(--panel-2);
  }
  aside h1 { font-size: 15px; letter-spacing: .5px; }
  aside h1 span { color: var(--accent); }
  .sessions { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 6px; }
  .session-btn {
    text-align: left;
    background: var(--panel-2);
    color: var(--text);
    border: none;
    border-radius: 8px;
    padding: 10px 12px;
    cursor: pointer;
    font-size: 13px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .session-btn.active { outline: 2px solid var(--accent); }
  .btn {
    background: var(--accent);
    color: #0f172a;
    font-weight: 600;
    border: none;
    border-radius: 8px;
    padding: 10px;
    cursor: pointer;
  }
  .btn.secondary { background: var(--panel-2); color: var(--text); }
  main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  #chat {
    flex: 1;
    overflow-y: auto;
    padding: 24px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  .msg {
    max-width: 70%;
    padding: 12px 14px;
    border-radius: 12px;
    line-height: 1.5;
    white-space: pre-wrap;
    word-break: break-word;
    font-size: 14px;
  }
  .msg.user { align-self: flex-end; background: var(--user); }
  .msg.assistant { align-self: flex-start; background: var(--assistant); }
  .msg.tool { align-self: flex-start; background: #2d1a0a; color: var(--tool); border: 1px solid var(--tool); font-size: 13px; }
  .msg.error { align-self: flex-start; background: #2a1215; color: var(--err); border: 1px solid var(--err); }
  .msg .label { display: block; font-size: 11px; text-transform: uppercase; letter-spacing: 1px; opacity: .8; margin-bottom: 4px; }
  #composer {
    display: flex;
    gap: 10px;
    padding: 16px 24px;
    border-top: 1px solid var(--panel-2);
    background: var(--panel);
  }
  #input {
    flex: 1;
    background: var(--panel-2);
    border: none;
    border-radius: 10px;
    color: var(--text);
    padding: 12px 14px;
    font-size: 14px;
  }
  #input:focus { outline: 2px solid var(--accent); }
  .hint { font-size: 12px; color: var(--muted); padding: 0 24px 4px; }
  .fade { opacity: .5; }
  .empty { color: var(--muted); text-align: center; margin-top: 20vh; }
</style>
</head>
<body>
<aside>
  <h1>AI Agent <span>Automation</span></h1>
  <button class="btn" id="new-session">+ New conversation</button>
  <div class="sessions" id="sessions"></div>
  <button class="btn secondary" id="open-knowledge">Knowledge base</button>
</aside>

<main>
  <div class="hint" id="status">Create a session or type below to start.</div>
  <div id="chat">
    <div class="empty" id="empty">
      Ask anything.<br>
      Try <em>"Calculate sin(pi/2) + sqrt(144)"</em>,
      <em>"What is the mean of 2 4 6 8 10?"</em>, or
      <em>"What is today's date?"</em>
    </div>
  </div>
  <div id="composer">
    <input id="input" placeholder="Message the AI agent..." autocomplete="off">
    <button class="btn" id="send">Send</button>
  </div>
</main>

<dialog id="knowledge-dialog">
  <h3>Knowledge base (RAG)</h3>
  <textarea id="doc-content" placeholder="Paste a document to index..."></textarea>
  <div style="display:flex;gap:8px;margin-top:10px">
    <button class="btn" id="ingest">Index document</button>
    <button class="btn secondary" id="close-dialog">Close</button>
  </div>
  <div id="doc-list" style="margin-top:12px"></div>
</dialog>

<script>
const API = "/api/v1";
const chat = document.getElementById("chat");
const empty = document.getElementById("empty");
const input = document.getElementById("input");
const statusEl = document.getElementById("status");
let sessions = [];
let currentSessionId = null;

function el(tag, className, text) {
  const node = document.createElement(tag);
  if (className) node.className = className;
  if (text) node.textContent = text;
  return node;
}

function addMessage(role, text) {
  empty.style.display = "none";
  const msg = el("div", "msg " + role);
  if (role === "tool") msg.appendChild(el("span", "label", "tool"));
  msg.appendChild(el("div", null, text));
  chat.appendChild(msg);
  chat.scrollTop = chat.scrollHeight;
  return msg;
}

async function refreshSessions() {
  const res = await fetch(API + "/sessions");
  sessions = await res.json();
  const box = document.getElementById("sessions");
  box.innerHTML = "";
  for (const s of sessions) {
    const btn = el("button", "session-btn" + (s.session_id === currentSessionId ? " active" : ""), s.session_id.slice(0, 8));
    btn.addEventListener("click", () => selectSession(s.session_id));
    box.appendChild(btn);
  }
}

async function newSession() {
  const res = await fetch(API + "/sessions", { method: "POST" });
  const session = await res.json();
  currentSessionId = session.session_id;
  chat.innerHTML = "";
  empty.style.display = "";
  statusEl.textContent = "Session " + session.session_id.slice(0, 8) + " ready.";
  await refreshSessions();
}

function selectSession(id) {
  currentSessionId = id;
  chat.innerHTML = "";
  empty.style.display = "";
  empty.innerHTML = "Loaded session " + id.slice(0, 8) + ". Ask a follow-up question.";
  statusEl.textContent = "Resumed session " + id.slice(0, 8) + ".";
  refreshSessions();
}

async function sendMessage() {
  const message = input.value.trim();
  if (!message) return;
  input.value = "";
  if (!currentSessionId) await newSession();

  addMessage("user", message);
  const placeholder = addMessage("assistant", "thinking...");
  statusEl.textContent = "Thinking...";

  try {
    const res = await fetch(API + "/agent", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ message, session_id: currentSessionId }),
    });
    const data = await res.json();
    placeholder.remove();
    if (data.tool_used) addMessage("tool", "Used tool: " + data.tool_used);
    addMessage("assistant", data.response || data.detail || JSON.stringify(data));
  } catch (err) {
    placeholder.remove();
    addMessage("error", "Request failed: " + err);
  }
  statusEl.textContent = "";
}

document.getElementById("send").addEventListener("click", sendMessage);
document.getElementById("input").addEventListener("keydown", (e) => {
  if (e.key === "Enter") sendMessage();
});
document.getElementById("new-session").addEventListener("click", newSession);

// Knowledge dialog
const dialog = document.getElementById("knowledge-dialog");
document.getElementById("open-knowledge").addEventListener("click", () => {
  dialog.showModal();
  loadDocuments();
});
document.getElementById("close-dialog").addEventListener("click", () => dialog.close());
document.getElementById("ingest").addEventListener("click", async () => {
  const content = document.getElementById("doc-content").value.trim();
  if (!content) return;
  await fetch(API + "/knowledge/documents", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ filename: "pasted.txt", title: "Pasted document", content }),
  });
  document.getElementById("doc-content").value = "";
  loadDocuments();
});

async function loadDocuments() {
  const res = await fetch(API + "/knowledge/documents");
  const docs = await res.json();
  const box = document.getElementById("doc-list");
  box.innerHTML = "<strong>Documents:</strong>";
  if (!docs.length) {
    box.appendChild(el("div", null, "No documents yet."));
    return;
  }
  for (const d of docs) {
    const row = el("div", null, d.title + " (" + d.chunk_count + " chunks)");
    box.appendChild(row);
  }
}

refreshSessions();
</script>
</body>
</html>
